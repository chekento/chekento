name: Sync APK download counts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-download-counts.yml'
      - 'tools/apps.json'
      - 'tools/sync_releases.py'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: release-presentation
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh APK links and counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sync_releases.py 
      - name: Save presentation updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/store.html docs/downloads.json assets/downloads assets/app-gallery
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: refresh APK links and download totals [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
