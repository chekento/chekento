name: Sync APK download counts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-download-counts.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update visible APK counters
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          apps = [
              ("PMDDcam", "v0.4.0", "PMDDcam-0.4.0.apk", "assets/app-gallery/pmddcam.svg"),
              ("scenic-path-android", "v0.7.3-rc4", "Scenic-Path-v0.7.3-rc4-debug.apk", "assets/app-gallery/scenic-path.svg"),
              ("Pizzascan", "v2.3.23", "PizzaScan-2.3.23.apk", "assets/app-gallery/pizzascan.svg"),
              ("Ainews", "android-latest", "AI-News.apk", "assets/app-gallery/ai-news.svg"),
              ("labyrinthia-endless-maze", "v2.4.3", "Labyrinthia-v2.4.3-debug.apk", "assets/app-gallery/labyrinthia.svg"),
              ("chroma-clash-android", "v1.0.0", "Chroma-Clash-1.0.0.apk", "assets/app-gallery/chroma-clash.svg"),
          ]

          token = os.environ.get("GH_TOKEN", "")
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "kosch-profile-download-counter",
          }
          if token:
              headers["Authorization"] = f"Bearer {token}"

          for repo, tag, asset_name, svg_path in apps:
              url = f"https://api.github.com/repos/chekento/{repo}/releases/tags/{tag}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  release = json.load(response)

              asset = next((a for a in release.get("assets", []) if a.get("name") == asset_name), None)
              if asset is None:
                  raise SystemExit(f"Asset not found: {repo} {tag} {asset_name}")

              count = int(asset.get("download_count", 0))
              with open(svg_path, "r", encoding="utf-8") as f:
                  svg = f.read()

              updated, n = re.subn(
                  r'(<text id="apk-download-count"[^>]*>↓ )\d+( APK downloads</text>)',
                  rf'\g<1>{count}\g<2>',
                  svg,
                  count=1,
              )
              if n != 1:
                  raise SystemExit(f"Download counter marker missing in {svg_path}")

              with open(svg_path, "w", encoding="utf-8") as f:
                  f.write(updated)
          PY

      - name: Commit changed counters
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app-gallery/*.svg
          if git diff --cached --quiet; then
            echo "Download counts are already current."
            exit 0
          fi
          git commit -m "chore: refresh APK download counts [skip ci]"
          git push
