name: Build K Companion AudioBridge APK

on:
  workflow_dispatch:
  push:
    branches: [k-android-bridge]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build APK
        run: gradle -p k-android-bridge/project :app:assembleDebug --stacktrace
      - name: Prepare named APK
        run: cp k-android-bridge/project/app/build/outputs/apk/debug/app-debug.apk K_Companion_AudioBridge_1.0.3.apk
      - name: Verify APK and signature
        run: |
          test -s K_Companion_AudioBridge_1.0.3.apk
          unzip -t K_Companion_AudioBridge_1.0.3.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs K_Companion_AudioBridge_1.0.3.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging K_Companion_AudioBridge_1.0.3.apk | head -12
          sha256sum K_Companion_AudioBridge_1.0.3.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: K_Companion_AudioBridge_1.0.3
          path: K_Companion_AudioBridge_1.0.3.apk
          if-no-files-found: error
