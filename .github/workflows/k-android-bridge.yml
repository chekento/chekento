name: Build K Companion AudioBridge APK

on:
  workflow_dispatch:
  push:
    branches:
      - k-android-bridge

permissions:
  contents: read

jobs:
  apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Unpack K Companion source
        run: |
          rm -rf k-android-bridge/build-src
          mkdir -p k-android-bridge/build-src
          unzip -q k-android-bridge/K_ANDROID_1_0_AudioBridge_Source.zip -d k-android-bridge/build-src

      - name: Build APK
        run: gradle -p k-android-bridge/build-src/K_ANDROID_1_0_AudioBridge_Source :app:assembleDebug --stacktrace

      - name: Prepare named APK
        run: cp k-android-bridge/build-src/K_ANDROID_1_0_AudioBridge_Source/app/build/outputs/apk/debug/app-debug.apk K_Companion_AudioBridge_1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: K_Companion_AudioBridge_1.0
          path: K_Companion_AudioBridge_1.0.apk
          if-no-files-found: error
